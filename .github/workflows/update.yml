name: Otomatik Yayın Güncelleyici
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v3
      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install chromium
      - name: Botu Çalıştır
        run: python main.py
      - name: Dosyaları GitHub'a Pushla
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add kanallar/* playlist.m3u
          git commit -m "Otomatik Güncelleme: Yeni yayın linkleri alındı" || echo "Değişiklik yok"
          git push
