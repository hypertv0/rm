name: Otomatik Yayin Guncelleyici
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Depoyu Cek
        uses: actions/checkout@v4
      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pip ve Playwright Kur
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install chromium --with-deps
      - name: Botu Calistir
        run: python main.py
      - name: Dosyalari Pushla
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kanallar/* playlist.m3u
          git diff --staged --quiet || git commit -m "Guncelleme: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
